<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Stars</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="student-data.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

<style>
  body { font-family: "Lexend", sans-serif; background: #FFFBEA; }
  .material-symbols-outlined { font-size: 26px; }

  /* subtle fade for cards */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-card { animation: fadeInUp 0.35s ease-out; }
</style>
</head>

<body class="min-h-screen bg-[#FFFBEA] flex flex-col">

<!-- PAGE WRAPPER -->
<div class="flex-1 flex flex-col">

  <!-- HEADER (full width) -->
  <header class="flex items-center justify-between px-6 py-4 sticky top-0 bg-[#FFFBEA]/95 backdrop-blur border-b border-emerald-100 z-20">
    <span onclick="history.back()" class="material-symbols-outlined text-emerald-900 cursor-pointer">
      arrow_back
    </span>
    <h1 class="text-emerald-900 text-xl md:text-2xl font-bold text-center flex-1">
      My Stars
    </h1>
    <div class="w-8"></div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="flex-1 px-4 md:px-10 lg:px-20 py-6 pb-28 space-y-8 max-w-5xl w-full mx-auto">

    <!-- TOTAL STARS HERO CARD -->
    <section class="rounded-2xl bg-gradient-to-br from-amber-200 via-yellow-100 to-emerald-50 p-6 md:p-8 shadow-md flex flex-col md:flex-row items-center justify-between gap-6 fade-card">
      <div class="flex flex-col items-center md:items-start gap-2">
        <span class="material-symbols-outlined text-yellow-500"
              style="font-size:64px; font-variation-settings:'FILL' 1;">
          star
        </span>
        <p class="text-sm md:text-base text-emerald-900/80">
          You’ve earned
        </p>
        <p id="totalStars" class="text-5xl md:text-6xl font-extrabold text-emerald-900 tracking-tight"></p>
        <p class="text-base md:text-lg text-emerald-900 font-medium">
          Total Stars Earned
        </p>
        <p class="text-sm md:text-base text-emerald-900/70">
          Keep exploring, learning, and completing tasks 🌟
        </p>
      </div>
      <div class="hidden md:flex flex-col items-end text-right gap-2">
        <p class="text-sm uppercase tracking-[0.2em] text-emerald-900/60 font-semibold">Progress</p>
        <p class="text-base text-emerald-900/80 max-w-xs">
          Every completed task adds up. Your consistency today becomes your superpower tomorrow.
        </p>
      </div>
    </section>

    <!-- RECENT ACTIVITY TITLE -->
    <div class="flex items-center justify-between">
      <h2 class="text-emerald-900 text-xl md:text-2xl font-bold">Recent Activity</h2>
    </div>

    <!-- RECENT ACTIVITY LIST -->
    <div id="recentList" class="flex flex-col gap-3 md:gap-4"></div>

  </main>
</div>

<!-- BOTTOM NAV (full width) -->
<nav class="fixed bottom-0 left-0 right-0 bg-white shadow-[0_-4px_12px_rgba(0,0,0,0.04)] border-t border-emerald-100">
  <div class="max-w-5xl mx-auto flex justify-around py-3 px-6">
    <a class="flex flex-col items-center text-gray-400 hover:text-emerald-800 transition"
       href="student_dashboard.html">
      <span class="material-symbols-outlined">home</span>
      <p class="text-xs font-medium">Home</p>
    </a>

    <a class="flex flex-col items-center text-gray-400 hover:text-emerald-800 transition"
       href="AIAssistance.html">
      <span class="material-symbols-outlined">school</span>
      <p class="text-xs font-medium">Learn</p>
    </a>

    <a class="flex flex-col items-center text-emerald-900 font-semibold"
       href="star.html">
      <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">star</span>
      <p class="text-xs font-medium">Stars</p>
    </a>
  </div>
</nav>

<script>
function formatDate(dateStr) {
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-IN', {
    day: 'numeric',
    month: 'short',
    year: 'numeric',
  });
}

async function loadStarsPage() {
  const email = localStorage.getItem('userEmail');
  if (!email) {
    alert("Please login first!");
    window.location.href = "studentlogin.html";
    return;
  }

  try {
    const res = await fetch(`http://localhost:5000/api/stars/${email}`);
    const data = await res.json();

    if (!res.ok) {
      alert(data.error || "Failed to load stars");
      return;
    }

    // total stars
    document.getElementById("totalStars").textContent = data.totalStars ?? 0;

    const recentContainer = document.getElementById("recentList");
    recentContainer.innerHTML = "";

    if (!data.completed || data.completed.length === 0) {
      recentContainer.innerHTML = `
        <p class="text-center text-gray-500 text-sm md:text-base py-6 bg-white/70 rounded-2xl shadow-inner">
          No completed tasks yet. Finish a task from Echobot to earn your first stars! ✨
        </p>`;
      return;
    }

    data.completed.forEach((task, index) => {
      const starsEarned = 10;
      const title = task.task_text;
      const date = formatDate(task.created_at);

      const card = document.createElement("div");
      card.className = "flex items-center justify-between bg-white p-4 md:p-5 rounded-2xl shadow-sm border border-emerald-50 fade-card";
      card.style.animationDelay = `${index * 40}ms`;

      card.innerHTML = `
        <div class="flex items-start gap-4">
          <span class="material-symbols-outlined text-green-700 rounded-xl bg-green-50 p-2">
            task_alt
          </span>
          <div>
            <p class="text-sm md:text-base font-semibold text-gray-800 leading-snug">
              ${title}
            </p>
            <p class="text-xs md:text-sm text-gray-500 mt-1">${date}</p>
          </div>
        </div>
        <p class="text-amber-600 font-extrabold text-lg md:text-xl pl-3">+${starsEarned}</p>
      `;

      recentContainer.appendChild(card);
    });

  } catch (err) {
    console.error(err);
    alert("Network error loading stars page");
  }
}

loadStarsPage();
</script>

</body>
</html>
