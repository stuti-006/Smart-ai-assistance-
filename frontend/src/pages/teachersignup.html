<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Teacher Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>

<style>
.material-symbols-outlined {
  font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
}
body { min-height: max(884px, 100dvh); }
</style>

<script id="tailwind-config">
tailwind.config = {
  darkMode: "class",
  theme: {
    extend: {
      colors: {
        "cream": "#F5F5DC",
        "dark-green": "#004d40",
      },
      fontFamily: {
        "display": ["Lexend", "sans-serif"],
      },
      borderRadius: {
        "DEFAULT": "0.5rem",
        "lg": "1rem",
        "xl": "1.5rem",
        "full": "9999px",
      },
    },
  },
}
</script>
</head>

<body class="font-display">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center bg-cream p-4">

<div class="w-full max-w-sm space-y-8">

  <!-- Header -->
  <div class="flex flex-col items-center space-y-4 text-center">
    <div class="bg-dark-green p-4 rounded-xl shadow-md">
      <svg fill="none" stroke="#F5F5DC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
      class="feather feather-book-open" width="48" height="48" viewBox="0 0 24 24">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
      </svg>
    </div>
    <h1 class="text-dark-green text-3xl font-bold leading-tight">Create an Account</h1>
  </div>

  <!-- Form -->
  <div class="space-y-6">
    <label class="flex flex-col">
      <p class="text-dark-green/90 text-sm font-medium pb-2">Name</p>
      <div class="flex items-stretch rounded-lg shadow-sm">
        <div class="flex items-center justify-center pl-4 bg-dark-green/10 rounded-l-lg text-dark-green/70">
          <span class="material-symbols-outlined" style="font-size:20px;">person</span>
        </div>
        <input id="teacherName" class="w-full rounded-r-lg bg-dark-green/10 h-14 p-4 placeholder:text-dark-green/50 text-dark-green focus:outline-none focus:ring-2 focus:ring-dark-green/50"
        placeholder="Enter your full name" type="text"/>
      </div>
    </label>

    <label class="flex flex-col">
      <p class="text-dark-green/90 text-sm font-medium pb-2">Email</p>
      <div class="flex items-stretch rounded-lg shadow-sm">
        <div class="flex items-center justify-center pl-4 bg-dark-green/10 rounded-l-lg text-dark-green/70">
          <span class="material-symbols-outlined" style="font-size:20px;">mail</span>
        </div>
        <input id="teacherEmail" class="w-full rounded-r-lg bg-dark-green/10 h-14 p-4 placeholder:text-dark-green/50 text-dark-green focus:outline-none focus:ring-2 focus:ring-dark-green/50"
        placeholder="Enter your email" type="email"/>
      </div>
    </label>

    <label class="flex flex-col">
      <p class="text-dark-green/90 text-sm font-medium pb-2">Password</p>
      <div class="flex items-stretch rounded-lg shadow-sm">
        <div class="flex items-center justify-center pl-4 bg-dark-green/10 rounded-l-lg text-dark-green/70">
          <span class="material-symbols-outlined" style="font-size:20px;">lock</span>
        </div>
        <input id="teacherPassword" class="w-full rounded-r-lg bg-dark-green/10 h-14 p-4 placeholder:text-dark-green/50 text-dark-green focus:outline-none focus:ring-2 focus:ring-dark-green/50"
        placeholder="Create a password" type="password"/>
      </div>
    </label>
  </div>

  <!-- Actions -->
  <div class="space-y-4">
    <button onclick="saveTeacherData()"
      class="w-full h-14 rounded-lg bg-dark-green text-cream font-bold shadow-lg hover:scale-105 transition-transform">
      Sign Up
    </button>

    <div class="text-center">
      <p class="text-dark-green/90 text-sm">Already have an account?
        <a onclick="redirectToLogin()" class="font-bold underline cursor-pointer">Login</a>
      </p>
    </div>
  </div>

</div>
</div>

<!-- ✨ JS to store data -->

<script src="teachersignup.js"></script>
</body>
</html>
