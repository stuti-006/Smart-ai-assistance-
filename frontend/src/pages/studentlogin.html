<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ECHOBOT Assistant Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1&display=swap" rel="stylesheet"/>

<style>
body { background:#FAF8F1; font-family:'Lexend', sans-serif; min-height: max(884px, 100dvh);}
.video-popup { display:none; }
video { width:100%; border-radius:12px; }
</style>
</head>

<body class="font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden p-4">

<div class="flex flex-col items-center justify-center pt-10">
<div class="flex items-center gap-3 pb-8">
<div class="flex h-12 w-12 items-center justify-center rounded-xl bg-[#1E392A] shadow-lg">
<span class="material-symbols-outlined text-white text-3xl">auto_awesome</span>
</div>
<h2 class="text-3xl font-bold text-[#1E392A] tracking-tight">ECHOBOT</h2>
</div>

<h1 class="text-[32px] font-bold text-[#1E392A] text-center">Welcome Back, Scholar!</h1>
<p class="text-[#1E392A]/80 text-base font-normal text-center pb-3">Mark your attendance</p>

<!-- Login / Signup Toggle -->
<div class="flex w-full max-w-md px-4 py-6">
<div class="flex h-12 flex-1 items-center justify-center rounded-xl bg-[#1E392A]/10 p-1 shadow-md">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 bg-[#1E392A] text-white shadow-lg text-sm font-medium">
<span>Login</span>
<input checked type="radio" name="auth-toggle" class="invisible w-0">
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 text-[#1E392A]/70 text-sm font-medium">
<span>Sign Up</span>
<input type="radio" onclick="window.location.href='studentsignup.html'" class="invisible w-0">
</label>
</div>
</div>

<!-- LOGIN FIELDS -->
<div class="w-full max-w-md px-4 space-y-5">
<label class="flex flex-col">
<p class="text-[#1E392A]/90 text-base font-medium pb-2">School Email</p>
<div class="flex items-center rounded-xl shadow-lg bg-[#1E392A]/10 border border-[#1E392A]/20">
<span class="material-symbols-outlined pl-4 text-[#1E392A]/80">mail</span>
<input id="loginEmail" class="w-full p-4 bg-transparent" placeholder="Enter your school email">
</div>
</label>

<label class="flex flex-col">
<p class="text-[#1E392A]/90 text-base font-medium pb-2">Date of Birth (Password)</p>
<div class="flex items-center rounded-xl shadow-lg bg-[#1E392A]/10 border border-[#1E392A]/20">
<span class="material-symbols-outlined pl-4 text-[#1E392A]/80">lock</span>
<input id="loginDOB" class="w-full p-4 bg-transparent" placeholder="Enter your password" type="password">
</div>
</label>
</div>

<!-- LOGIN BUTTON -->
<div class="w-full max-w-md px-4 pt-8">
<button onclick="loginStudent()" class="flex h-14 w-full items-center justify-center rounded-xl bg-[#1E392A] text-[#FAF8F1] text-base font-bold shadow-lg active:scale-95">
Log In
</button>
</div>

<!-- ALTERNATIVE SIGN IN -->
<p class="text-sm text-center text-[#1E392A]/70 pt-8 pb-4">Or continue with</p>

<div class="flex w-full max-w-md items-center justify-center gap-4 px-4">

<button onclick="openCamera()" class="flex flex-col items-center justify-center gap-2 rounded-xl bg-[#1E392A]/10 p-4 w-40 h-28 shadow-lg active:scale-95">
<span class="text-sm font-medium text-[#1E392A]">QR Code Scan</span>
</button>
</div>

</div>
</div>


<!-- ✅ QR SCANNER MODAL -->
<div id="cameraModal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4" style="display:none;">
  <div class="bg-white p-4 rounded-xl w-full max-w-md">
    <p class="text-center font-semibold pb-2">Scan Your QR Code</p>
    <div id="qrScanner" class="w-full h-64 rounded-xl overflow-hidden"></div>
    <video id="cameraFeed" autoplay playsinline style="display:none;"></video>
    <div class="flex gap-3 pt-4">
      <button id="captureBtn" class="flex-1 h-11 bg-[#1E392A] text-white rounded-lg font-semibold">Capture</button>
      <button onclick="closeCamera()" class="flex-1 h-11 bg-gray-200 rounded-lg font-semibold">Cancel</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>
// CAMERA
let stream;
function openCamera(){
  document.getElementById("cameraBox").style.display = "flex";
  navigator.mediaDevices.getUserMedia({ video:true })
  .then(s => {
    stream = s;
    document.getElementById("camera").srcObject = s;
  })
  .catch(() => alert("Camera permission denied"));
}
function closeCamera() {
  const modal = document.getElementById("cameraModal");
  if (modal) modal.style.display = "none";

  if (typeof stream !== "undefined" && stream) {
    stream.getTracks().forEach(t => t.stop());
  }

  if (typeof qrscanner !== "undefined" && qrscanner) {
    try {
      qrscanner.stop();
    } catch (err) {
      console.warn("QR scanner already stopped");
    }
  }
}


</script>
<script src="studentlogin.js"></script>
</body>
</html>
